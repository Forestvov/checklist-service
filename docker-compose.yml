services:
  checklist-postgres:
    image: postgres:18-bookworm
    container_name: checklist-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: always

  checklist-postgres-migrate:
    image: migrate/migrate:4
    depends_on:
      checklist-postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@checklist-postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up
    restart: on-failure

  checklist-app:
    build:
      context: .
      dockerfile: cmd/app/Dockerfile
    container_name: checklist-app
    depends_on:
      checklist-postgres:
        condition: service_healthy
      checklist-postgres-migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      HTTP_ADDR: :5050
      POSTGRES_HOST: checklist-postgres
      POSTGRES_PORT: 5432
      LOGGER_FOLDER: /app/out/logs
    ports:
      - '127.0.0.1:5050:5050'
    volumes:
      - checklist-logs:/app/out/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5050/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: checklist-postgres-forwarder
    profiles: ["tools"]
    depends_on:
      checklist-postgres:
        condition: service_healthy
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:checklist-postgres:5432
    ports:
      - '127.0.0.1:5432:5432'

  swagger:
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.26.4-alpine
        RUN apk add --no-cache git
        RUN go install github.com/swaggo/swag/cmd/swag@v1.16.6
        WORKDIR /code
        ENTRYPOINT ["swag"]
    profiles: ["tools"]
    volumes:
      - .:/code

volumes:
  checklist-logs:
