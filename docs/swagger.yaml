info:
  contact: {}
paths:
  /api/v1/tasks:
    get:
      description: |-
        Returns tasks ordered from newest to oldest using page-based pagination.
        If page or per_page is omitted, the defaults are page=1 and per_page=20.
        A page beyond the available range returns an empty data array with the requested pagination metadata.
      parameters:
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Number of tasks per page
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated task list
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTasksResponse'
        "400":
          description: Invalid pagination parameters
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
      summary: Get tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: |-
        Creates a new task with a required title and an optional description.
        The title must contain 3–255 Unicode characters after leading and trailing whitespace is ignored.
        The description may be omitted and must not exceed 5000 Unicode characters when provided.
      parameters:
      - description: Task creation data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Task created successfully
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Malformed JSON or request validation failed
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
      summary: Create a task
      tags:
      - tasks
swagger: "2.0"
