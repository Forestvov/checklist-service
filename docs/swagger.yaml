info:
  contact: {}
paths:
  /api/v1/tasks:
    get:
      description: |-
        Returns a filtered and sorted task list using page-based pagination.
        If page or per_page is omitted, the defaults are page=1 and per_page=20.
        If done is omitted, tasks of both statuses are returned.
        If priority is omitted, tasks of all priorities are returned.
        By default, tasks are ordered by created_at in descending order.
        A page beyond the available range returns an empty data array with the requested pagination metadata.
      parameters:
      - default: 1
        description: Page number
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Number of tasks per page
        in: query
        maximum: 100
        minimum: 1
        name: per_page
        type: integer
      - description: Filter by completion status
        in: query
        name: done
        type: boolean
      - description: Filter by priority
        enum:
        - low
        - medium
        - high
        in: query
        name: priority
        type: string
      - default: created_at
        description: Sort field
        enum:
        - created_at
        - updated_at
        - title
        - priority
        in: query
        name: sort
        type: string
      - default: desc
        description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated task list
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTasksResponse'
        "400":
          description: Invalid pagination or filter parameters
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
      summary: Get tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: |-
        Creates a task with a required title and optional description, priority, and deadline.
        Priority may be low, medium, or high. The default is medium.
        DueAt must use RFC3339 format when provided.
        The title must contain 3–255 Unicode characters after leading and trailing whitespace is ignored.
        The description may be omitted and must not exceed 5000 Unicode characters when provided.
      parameters:
      - description: Task creation data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Task created successfully
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Malformed JSON or request validation failed
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
      summary: Create a task
      tags:
      - tasks
  /api/v1/tasks/{id}:
    delete:
      description: |-
        Permanently deletes the task with the specified integer identifier.
        A successful deletion returns 204 with an empty response body.
      parameters:
      - description: Task identifier
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Task deleted successfully
        "400":
          description: Task identifier is not a valid integer
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
      summary: Delete a task
      tags:
      - tasks
    get:
      description: |-
        Returns a single task with the specified integer identifier.
        Returns 404 when the task does not exist.
      parameters:
      - description: Task identifier
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Task found
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTaskResponse'
        "400":
          description: Task identifier is not a valid integer
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
      summary: Get a task
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: |-
        Partially updates the task with the specified integer identifier.
        Send at least one of title, description, done, priority, or due_at. Omitted fields remain unchanged.
        Null is allowed only for due_at and removes the current deadline.
        The title must contain 3–255 Unicode characters after leading and trailing whitespace is ignored. The description must not exceed 5000 Unicode characters.
      parameters:
      - description: Task identifier
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Task updated successfully
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.UpdateTaskResponse'
        "400":
          description: Malformed JSON, invalid task identifier, or request validation
            failed
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Unexpected server error
          schema:
            $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse'
      summary: Update a task
      tags:
      - tasks
swagger: "2.0"
