  internal_features_tasks_transport_http.GetTasksResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
        type: array
      meta:
        $ref: '#/definitions/github_com_Forestvov_checklist-service_internal_core_transport_http_response.PaginationMeta'
    type: object
  internal_features_tasks_transport_http.TaskDTOResponse:
    properties:
