definitions:
  github_com_Forestvov_checklist-service_internal_core_transport_http_response.ErrorResponse:
    properties:
      error:
        example: full error text
        type: string
      message:
        example: short human-readable message
        type: string
    type: object
  github_com_Forestvov_checklist-service_internal_core_transport_http_response.PaginationMeta:
    properties:
      page:
        example: 2
        type: integer
      per_page:
        example: 20
        type: integer
      total:
        example: 47
        type: integer
      total_pages:
        example: 3
        type: integer
    type: object
  internal_features_tasks_transport_http.CreateTaskRequest:
    properties:
      description:
        description: Description is optional and may contain up to 5000 Unicode characters.
        example: Milk, bread, and vegetables
        maxLength: 5000
        type: string
      title:
        description: |-
          Title is required and must contain between 3 and 255 Unicode characters
          after leading and trailing whitespace is ignored.
        example: Buy groceries
        maxLength: 255
        minLength: 3
        type: string
